plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'org.parchmentmc.librarian.forgegradle' version '1.+'
    id 'org.spongepowered.mixin' version '0.7.+'
    id 'java'
}

version = "${mod_version}"
group = "${mod_group_id}"
base { archivesName = "${mod_id}" }

java { toolchain.languageVersion = JavaLanguageVersion.of(17) }

minecraft {
    mappings channel: mapping_channel, version: mapping_version
    copyIdeResources = true
}

mixin {
    add sourceSets.main, "monsterspellbooks.refmap.json"
    config "monsterspellbooks.mixins.json"
}

sourceSets.main.resources { srcDir 'src/generated/resources' }
sourceSets.main.java { exclude 'net/redreaper/monsterspellbooks/datagen/**'; exclude 'net/redreaper/monsterspellbooks/worldgen/**' }

repositories {
    mavenCentral()
    maven { name = 'Iron\'s Spells (redspace)'; url = 'https://code.redspace.io/releases' }
    maven { name = 'Curios'; url = 'https://maven.theillusivec4.top/' }
    maven { name = 'GeckoLib'; url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/' }
    maven { name = 'JEI (BlameJared)'; url = 'https://maven.blamejared.com/' }
    maven { name = 'Player Animator (KosmX)'; url = 'https://maven.kosmx.dev/' }
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
    implementation fg.deobf("io.redspace:irons_spellbooks:${irons_version}")
    implementation fg.deobf("io.redspace:irons_lib:${irons_lib_version}")
    compileOnly fg.deobf("software.bernie.geckolib:geckolib-forge-1.20.1:${geckolib_version}")
    compileOnly fg.deobf("top.theillusivec4.curios:curios-forge:${curios_version}")
    compileOnly fg.deobf("maven.modrinth:azurelib:${azurelib_version}")
    compileOnly fg.deobf("maven.modrinth:aces-spell-utils:${aces_spell_utils_version}")
    compileOnly fg.deobf("dev.kosmx.player-anim:player-animation-lib-forge:${player_animator_version}")
    compileOnly fg.deobf("mezz.jei:jei-1.20.1-common-api:${jei_version}")
    compileOnly fg.deobf("mezz.jei:jei-1.20.1-forge-api:${jei_version}")
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
            'Specification-Title'   : mod_id,
            'Specification-Vendor'  : mod_authors,
            'Specification-Version' : '1',
            'Implementation-Title'  : mod_name,
            'Implementation-Version': mod_version,
            'Implementation-Vendor' : mod_authors,
            'MixinConfigs'          : 'monsterspellbooks.mixins.json'
        ])
    }
    finalizedBy 'reobfJar'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs << '-Xmaxerrs' << '5000'
}
